<div class="shell">
  <aside class="sidebar fade-in">
    <div class="brand">
      <span class="logo-dot"></span>
      <div>
        <p class="brand-title">YoloFarm</p>
        <p class="brand-subtitle">IoT Console</p>
      </div>
    </div>

    <nav class="nav-list">
      @for (item of visibleNavItems(); track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>

    <button type="button" class="btn btn-ghost" (click)="logout()">Log Out</button>
  </aside>

  <main class="workspace">
    <header class="workspace-header fade-in">
      <div>
        <p class="eyebrow">Farm Operations</p>
        <h1>Welcome, {{ userLabel() }}</h1>
      </div>

      <p class="role-chip">Role: {{ authStore.role() ?? 'USER' }}</p>
    </header>

    <section class="workspace-body">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
